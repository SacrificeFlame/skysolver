apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: skysolver-worker-autoscaler
spec:
  scaleTargetRef:
    name: skysolver-worker
  # Scale based on partition queue depth (no fixed batch caps)
  minReplicaCount: 3
  maxReplicaCount: 100  # Elastic horizontal scaling under load
  pollingInterval: 10  # Check queue depth every 10s
  cooldownPeriod: 120  # Don't scale down too aggressively
  triggers:
  # Scale on Pulsar backlog (disruption volume drives scaling)
  - type: pulsar
    metadata:
      adminURL: http://pulsar:8080
      topic: persistent://public/default/skysolver-partitions
      subscription: skysolver-worker-group
      threshold: "50"  # Scale up when >50 messages queued per partition
      activationThreshold: "10"
  # Scale on CPU (compute pressure)
  - type: cpu
    metadata:
      type: Utilization
      value: "70"
  # Scale on custom metric: active disruption count
  - type: prometheus
    metadata:
      serverAddress: http://prometheus:9090
      metricName: skysolver_active_disruptions
      threshold: "5"
      query: sum(skysolver_active_disruptions)
---
# Separate Tier 2 optimizer deployment (time-boxed, fewer replicas)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: skysolver-tier2-autoscaler
spec:
  scaleTargetRef:
    name: skysolver-tier2
  minReplicaCount: 1
  maxReplicaCount: 30
  pollingInterval: 15
  triggers:
  - type: pulsar
    metadata:
      adminURL: http://pulsar:8080
      topic: persistent://public/default/skysolver-tier2-queue
      subscription: skysolver-tier2-group
      threshold: "10"
