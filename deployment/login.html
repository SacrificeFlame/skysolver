<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkySolver Kinetic — Sign in</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #07111e, #10243a);
      color: #eaf7ff;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(92vw, 420px);
      padding: 28px;
      border-radius: 14px;
      background: rgba(8, 19, 31, 0.9);
      border: 1px solid rgba(172,237,255,0.25);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 { margin-top: 0; font-size: 24px; }
    .muted { color: #74a5bd; font-size: 13px; }
    label { display: block; margin-top: 12px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
    input { width: 100%; padding: 10px 12px; margin-top: 6px; border-radius: 8px; border: 1px solid #27445a; background: #091724; color: white; }
    button { width: 100%; padding: 10px 12px; margin-top: 16px; border: none; border-radius: 8px; background: linear-gradient(90deg, #4cd7f6, #4ae176); color: #031018; font-weight: 700; cursor: pointer; }
    .error { color: #ff9e9e; margin-top: 10px; font-size: 13px; display: none; }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; margin: 4px 0 18px; }
    .brand svg { filter: drop-shadow(0 3px 10px rgba(56,207,228,.3)); }
    .brand .wm { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .brand .wm strong { font-size: 24px; font-weight: 800; letter-spacing: .16em; color: #eef4fb; }
    .brand .wm span { font-size: 10px; font-weight: 700; letter-spacing: .5em; color: #4bd7ea; padding-left: .5em; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="72" height="56" viewBox="0 0 160 125" aria-label="SkySolver Kinetic">
        <defs>
          <linearGradient id="lb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fd0e6" stop-opacity=".95"/><stop offset="1" stop-color="#3fd0e6" stop-opacity="0"/></linearGradient>
          <linearGradient id="lbody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf4fc"/><stop offset="1" stop-color="#3f93c4"/></linearGradient>
          <linearGradient id="lglass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c2c4a"/><stop offset="1" stop-color="#54a9dd"/></linearGradient>
        </defs>
        <path d="M58 60 L102 60 L80 116 Z" fill="url(#lb)"/>
        <path d="M74 44 L20 32 L15 35 L18 40 L72 51 Z" fill="#2f7fb8"/>
        <path d="M86 44 L140 32 L145 35 L142 40 L88 51 Z" fill="#2f7fb8"/>
        <path d="M15 35 L11 27 L18 32 Z" fill="#2f7fb8"/><path d="M145 35 L149 27 L142 32 Z" fill="#2f7fb8"/>
        <circle cx="50" cy="50" r="7" fill="#2f7fb8"/><circle cx="50" cy="50" r="3" fill="#0b243c"/>
        <circle cx="110" cy="50" r="7" fill="#2f7fb8"/><circle cx="110" cy="50" r="3" fill="#0b243c"/>
        <line x1="80" y1="5" x2="80" y2="14" stroke="#2f7fb8" stroke-width="1.8"/>
        <path d="M80 12 C 75 16 73 23 73 35 C 73 51 76 60 80 63 C 84 60 87 51 87 35 C 87 23 85 16 80 12 Z" fill="url(#lbody)" stroke="#2f7fb8" stroke-width="1"/>
        <path d="M80 22 C 77 25 76 31 76 39 C 76 47 78 51 80 53 C 82 51 84 47 84 39 C 84 31 83 25 80 22 Z" fill="url(#lglass)"/>
      </svg>
      <div class="wm"><strong>SKYSOLVER</strong><span>KINETIC</span></div>
    </div>
    <div class="muted">Sign in to review recovery operations, passenger reaccommodation, and disruption telemetry.</div>
    <label>Username</label>
    <input id="username" value="ops" />
    <label>Password</label>
    <input id="password" type="password" value="sky2026" />
    <button onclick="submitLogin()">Sign In</button>
    <div id="error" class="error"></div>
  </div>
  <script>
    async function submitLogin() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await response.json();
      if (data.ok) {
        window.location.href = data.redirect;
      } else {
        errorEl.style.display = 'block';
        errorEl.textContent = data.error || 'Login failed';
      }
    }
  </script>
</body>
</html>
