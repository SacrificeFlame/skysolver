name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deployment/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: deployment/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q core data deployment passengers predictive rules solvers state chaos
      - name: Run test suite
        run: python -m pytest -q
      - name: Smoke-test Tier 1 worker
        run: python -m deployment.worker --partition DEN --tier 1 --time-budget 0.2
      - name: Smoke-test Tier 2 upgrade path
        run: python -m deployment.worker --partition DEN --tier 2 --time-budget 0.2
      - name: Verify deterministic recovery orchestration
        run: python -m pytest tests/test_orchestrator.py tests/test_event_store_v2.py -q
