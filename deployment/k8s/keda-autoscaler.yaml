apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: {name: skysolver-msk-iam}
spec:
  podIdentity: {provider: aws-eks}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: {name: skysolver-tier1}
spec:
  scaleTargetRef: {name: skysolver-tier1}
  minReplicaCount: 3
  maxReplicaCount: 100
  pollingInterval: 10
  cooldownPeriod: 180
  fallback: {failureThreshold: 3, replicas: 6}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
        scaleUp:
          stabilizationWindowSeconds: 0
          policies: [{type: Percent, value: 100, periodSeconds: 30}]
  triggers:
    - type: apache-kafka
      metadata:
        bootstrapServersFromEnv: MSK_BOOTSTRAP_SERVERS
        consumerGroup: skysolver-tier1-v1
        topic: recovery.partition.jobs.v1
        lagThreshold: "25"
        activationLagThreshold: "1"
        offsetResetPolicy: latest
        sasl: aws_msk_iam
        tls: enable
      authenticationRef: {name: skysolver-msk-iam}
