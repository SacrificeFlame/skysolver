<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkySolver Kinetic — Sign in</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: linear-gradient(135deg, #07111e, #10243a);
      color: #eaf7ff;
      height: 100vh;
      display: grid;
      place-items: center;
    }
    * { box-sizing: border-box; }
    .card {
      width: min(92vw, 400px);
      padding: 34px 32px 30px;
      border-radius: 16px;
      background: rgba(8, 19, 31, 0.92);
      border: 1px solid rgba(172,237,255,0.18);
      box-shadow: 0 24px 70px rgba(0,0,0,0.45);
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }
    .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .brand svg { filter: drop-shadow(0 3px 12px rgba(56,207,228,.32)); }
    .brand .wm { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .brand .wm strong { font-size: 25px; font-weight: 800; letter-spacing: .18em; color: #eef4fb; }
    .brand .wm span { font-size: 10px; font-weight: 700; letter-spacing: .5em; color: #4bd7ea; padding-left: .5em; }
    .muted { color: #7fa2ba; font-size: 12.5px; line-height: 1.5; text-align: center; margin: 14px 0 22px; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 15px; text-align: left; }
    label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; color: #6f8aa0; }
    input { width: 100%; height: 44px; padding: 0 14px; border-radius: 9px; border: 1px solid #27445a; background: #0a1826; color: #eef7ff; font-size: 14px; }
    input::placeholder { color: #4f6a7e; }
    input:focus { outline: none; border-color: #38cfe4; box-shadow: 0 0 0 3px rgba(56,207,228,.15); }
    button { width: 100%; height: 46px; margin-top: 6px; border: none; border-radius: 9px; background: linear-gradient(90deg, #38cfe4, #3ecf8e); color: #041018; font-weight: 800; font-size: 14px; letter-spacing: .02em; cursor: pointer; }
    button:hover { filter: brightness(1.06); }
    .error { color: #ff9e9e; margin-top: 12px; font-size: 13px; text-align: center; display: none; }
    .hint { margin-top: 16px; text-align: center; font-size: 10.5px; color: #4f6577; letter-spacing: .04em; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <svg width="150" height="54" viewBox="205 175 790 285" preserveAspectRatio="xMidYMid meet" aria-label="SkySolver Kinetic">
        <defs>
          <linearGradient id="lfus" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#116da3"/><stop offset=".48" stop-color="#80b4d0"/><stop offset="1" stop-color="#f3f8fb"/></linearGradient>
          <linearGradient id="lflt" x1="0" y1="0" x2=".78" y2="1"><stop offset="0" stop-color="#19aed0"/><stop offset=".58" stop-color="#59cee1"/><stop offset="1" stop-color="#d5f2f7"/></linearGradient>
        </defs>
        <path d="M270 292 L600 442 L930 292 L741 354 L600 396 L459 354 Z" fill="url(#lflt)"/>
        <path d="M225 267 L565 291 L565 331 L482 323 L469 316 L452 316 L447 333 L420 329 L415 314 L396 312 L391 323 L366 320 L360 307 L225 276 Z" fill="#086aa1"/>
        <path d="M975 267 L635 291 L635 331 L718 323 L731 316 L748 316 L753 333 L780 329 L785 314 L804 312 L809 323 L834 320 L840 307 L975 276 Z" fill="#086aa1"/>
        <g fill="#f8fcfe" stroke="#f8fcfe" stroke-width="7"><circle cx="470" cy="317" r="24"/><circle cx="730" cy="317" r="24"/></g>
        <g fill="none" stroke="#116fa5" stroke-width="6"><circle cx="470" cy="317" r="18"/><circle cx="730" cy="317" r="18"/></g>
        <g fill="#116fa5"><circle cx="470" cy="317" r="5"/><circle cx="730" cy="317" r="5"/><path d="M470 299l4 12 12-4-9 10 9 10-12-4-4 12-4-12-12 4 9-10-9-10 12 4z"/><path d="M730 299l4 12 12-4-9 10 9 10-12-4-4 12-4-12-12 4 9-10-9-10 12 4z"/></g>
        <path d="M600 187 L591 224 L609 224 Z" fill="#08699e"/>
        <path d="M600 216 C578 216 563 228 560 247 L558 306 C557 352 572 382 600 382 C628 382 643 352 642 306 L640 247 C637 228 622 216 600 216 Z" fill="#f7fbfd" stroke="#08699e" stroke-width="5"/>
        <path d="M600 249 C576 259 564 279 565 316 C566 350 578 370 600 370 C622 370 634 350 635 316 C636 279 624 259 600 249 Z" fill="url(#lfus)"/>
        <path d="M560 286 C552 329 563 380 600 389 C637 380 648 329 640 286 L643 342 C640 384 624 402 600 402 C576 402 560 384 557 342 Z" fill="#ffffff" stroke="#8dd9e8" stroke-width="3"/>
      </svg>
      <div class="wm"><strong>SKYSOLVER</strong><span>KINETIC</span></div>
    </div>
    <div class="muted">Sign in to review recovery operations, passenger reaccommodation and disruption telemetry.</div>
    <form onsubmit="submitLogin(event)" autocomplete="off">
      <div class="field"><label for="username">Username</label><input id="username" name="username" placeholder="Operator ID" autocomplete="off" autofocus /></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="••••••••" autocomplete="new-password" /></div>
      <button type="submit">Sign In</button>
    </form>
    <div id="error" class="error"></div>
    <div class="hint">Authorized operations personnel only</div>
  </div>
  <script>
    async function submitLogin(event) {
      if (event) event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await response.json();
      if (data.ok) {
        window.location.href = data.redirect;
      } else {
        errorEl.style.display = 'block';
        errorEl.textContent = data.error || 'Login failed';
      }
    }
  </script>
</body>
</html>
